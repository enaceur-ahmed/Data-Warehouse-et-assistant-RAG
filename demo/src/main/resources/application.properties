spring.application.name=BI_Project

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DW-Projet;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

server.port=8080
# PAS DE CONTEXT PATH ICI !

logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Local (git-ignored) config: openrouter.api-key / openrouter.model
spring.config.import=optional:classpath:application-local.properties

# OpenRouter (key comes from env OPENROUTER_API_KEY or application-local.properties)
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.model=${OPENROUTER_MODEL:}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.referer=http://localhost:5173
openrouter.title=HR BI Dashboard
openrouter.timeout-seconds=60
openrouter.max-retries=2
openrouter.temperature=0.2
openrouter.max-tokens=1500