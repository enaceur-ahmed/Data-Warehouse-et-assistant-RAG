# LOCAL config template — copy to application-local.properties (git-ignored)
# and fill in your key. NEVER commit the real file.
# The key can also be provided via the environment variable OPENROUTER_API_KEY
# (env var takes precedence over this file).
openrouter.api-key=your_key_here
# First working free model id returned by model discovery
# (GET https://openrouter.ai/api/v1/models, pricing 0, ":free").
# NOTE: ":free" models can disappear or be rate-limited at any time.
openrouter.model=
